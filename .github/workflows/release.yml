name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to re-package (e.g. v0.2.2)'
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Build and publish the store zip
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify the tag matches the manifest version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          manifest_version="$(node -p "require('./extension/manifest.json').version")"
          if [ "$tag" != "v$manifest_version" ]; then
            echo "Tag $tag does not match extension/manifest.json version $manifest_version." >&2
            exit 1
          fi

      - name: Validate and test
        run: npm run verify

      - name: Build the store zip
        run: npm run package

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
