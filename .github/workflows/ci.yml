name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Validate manifest, permissions, and version sync
        run: npm run check

      - name: Run the test suite
        run: npm test

  artwork:
    name: Icons match their generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Fail if the committed PNGs drifted from scripts/generate-icons.js
        run: npm run icons:check

  package:
    name: Package unpacked extension
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build the store zip
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: tapgerman-unpacked-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
